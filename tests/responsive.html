<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>KART responsive QA (development only)</title>
<style>
  body { margin: 20px; background: #ddd; font: 16px sans-serif; }
  main { display: flex; gap: 24px; align-items: start; }
  iframe { border: 1px solid #aaa; background: white; height: 850px; }
  section { flex: 0 0 auto; }
</style>
<h1>Responsive QA — live application, no fixture data</h1>
<pre id="metrics" aria-live="polite"></pre>
<button id="show-filings">Show filing rows</button>
<button id="show-tax">Show tax card</button>
<button id="show-gauges">Show ownership gauges</button>
<button id="focus-home">Focus mobile home</button>
<button id="focus-stock">Focus mobile stock</button>
<main>
  <section><h2>Search / 375px</h2><iframe title="Mobile search" src="/search?q=Samsung" width="375"></iframe></section>
  <section><h2>Filings / 768px</h2><iframe title="Tablet filings" src="/disclosures" width="768"></iframe></section>
  <section><h2>Home / 375px</h2><iframe title="Mobile home" src="/" width="375"></iframe></section>
  <section><h2>Signup / 375px</h2><iframe title="Mobile signup" src="/signup" width="375"></iframe></section>
  <section><h2>My page / 375px</h2><iframe title="Mobile my page" src="/my" width="375"></iframe></section>
  <section><h2>Login / 768px</h2><iframe title="Tablet login" src="/login" width="768"></iframe></section>
  <section><h2>Home / 1440px</h2><iframe title="Desktop home" src="/" width="1440"></iframe></section>
  <section><h2>Stock / 375px</h2><iframe title="Mobile stock" src="/stocks/032640" width="375"></iframe></section>
</main>
<script>
  const frames = [...document.querySelectorAll('iframe')];
  const measure = () => {
    document.querySelector('#metrics').textContent = frames.map(frame => {
      const doc = frame.contentDocument;
      if (!doc) return `${frame.title}: loading`;
      const root = doc.documentElement;
      const rows = [...doc.querySelectorAll('.disclosure-rows section > a')];
      const hiddenTitles = rows.filter(row => getComputedStyle(row.querySelector('strong')).display === 'none').length;
      const datedRows = [...doc.querySelectorAll('.filing-row, .disclosure-rows section > a, .search-filings section > a')];
      const dateOverlaps = datedRows.filter(row => {
        const date = row.children[row.classList.contains('filing-row') ? 1 : 0];
        const dot = row.querySelector('.filing-timeline-dot');
        if (!dot || !dot.getClientRects().length) return false;
        const range = doc.createRange();
        range.selectNodeContents(date);
        const text = range.getBoundingClientRect();
        const point = dot.getBoundingClientRect();
        return text.right > point.left && text.left < point.right && text.bottom > point.top && text.top < point.bottom;
      }).length;
      const taxCard = doc.querySelector('.treaty-card');
      const taxNote = doc.querySelector('.tax-note');
      const gap = taxCard && taxNote ? `, tax note gap=${Math.round(taxNote.getBoundingClientRect().top - taxCard.getBoundingClientRect().bottom)}px, blurred rows=${doc.querySelectorAll('.treaty-row-locked').length}` : '';
      const name = doc.querySelector('.stock-name-heading h1')?.getBoundingClientRect();
      const heart = doc.querySelector('.stock-name-heading .heart-button')?.getBoundingClientRect();
      const heartGap = name && heart ? `, heart center offset=${Math.round(name.top + name.height / 2 - heart.top - heart.height / 2)}px` : '';
      const forecasts = [...doc.querySelectorAll('.ownership-forecast-caption')].map(item => item.textContent).join('; ');
      const panel = doc.querySelector('.ownership-panel');
      const panelWidth = panel ? `, ownership panel=${Math.round(panel.getBoundingClientRect().width)}px` : '';
      const gauges = [...doc.querySelectorAll('.ownership-gauge')];
      const motion = gauges.length ? `, revealed gauges=${gauges.filter(item => item.classList.contains('is-revealed')).length}/${gauges.length}, fill transition=${getComputedStyle(gauges[0].querySelector('.ownership-gauge-fill')).transitionDuration}` : '';
      return `${frame.title}: width=${root.clientWidth}, content=${root.scrollWidth}, rows=${rows.length}, hidden titles=${hiddenTitles}, date/dot overlaps=${dateOverlaps}${gap}${heartGap}${panelWidth}${motion}${forecasts ? `, ${forecasts}` : ''}`;
    }).join('\n');
  };
  for (const frame of frames) frame.addEventListener('load', () => {
    new ResizeObserver(measure).observe(frame.contentDocument.body);
    frame.contentDocument.addEventListener('transitionend', measure);
    measure();
  });
  document.querySelector('#show-filings').onclick = () => {
    for (const frame of frames) {
      const target = frame.contentDocument?.querySelector('.disclosure-rows, .filing-row');
      if (target) frame.contentWindow.scrollTo(0, target.getBoundingClientRect().top + frame.contentWindow.scrollY);
    }
    measure();
  };
  document.querySelector('#show-tax').onclick = () => {
    for (const frame of frames) {
      const target = frame.contentDocument?.querySelector('.treaty-card');
      if (target) {
        frame.scrollIntoView({ block: 'start', inline: 'center' });
        frame.contentWindow.scrollTo(0, target.getBoundingClientRect().top + frame.contentWindow.scrollY - 70);
      }
    }
    measure();
  };
  document.querySelector('#show-gauges').onclick = () => {
    for (const frame of frames) {
      const target = frame.contentDocument?.querySelector('.ownership-grid, .ownership-panel');
      if (target) frame.contentWindow.scrollTo(0, target.getBoundingClientRect().top + frame.contentWindow.scrollY - 60);
    }
    measure();
  };
  document.querySelector('#focus-home').onclick = () => frames.find(frame => frame.title === 'Mobile home').scrollIntoView({ block: 'start', inline: 'center' });
  document.querySelector('#focus-stock').onclick = () => frames.find(frame => frame.title === 'Mobile stock').scrollIntoView({ block: 'start', inline: 'center' });
</script>
</html>
